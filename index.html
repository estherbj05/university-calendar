<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Universidad</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app">

    <!-- Cabecera -->
    <header>
      <h1>Universidad</h1>
    </header>

    <!-- Pestañas de navegación -->
    <div id="tabs">
      <button class="tab activo" data-vista="calendario">Calendario</button>
      <button class="tab" data-vista="horario">Horario</button>
    </div>

    <!-- ======================== -->
    <!-- VISTA: Calendario        -->
    <!-- ======================== -->
    <div id="vista-calendario">

      <div id="nav-meses">
        <button id="btn-anterior">←</button>
        <h2 id="titulo-mes"></h2>
        <button id="btn-siguiente">→</button>
      </div>

      <div id="dias-semana">
        <span>L</span><span>M</span><span>X</span>
        <span>J</span><span>V</span><span>S</span><span>D</span>
      </div>

      <div id="calendario"></div>

      <button id="btn-añadir">+ Añadir evento</button>

    </div>

    <!-- ======================== -->
    <!-- VISTA: Horario           -->
    <!-- ======================== -->
    <div id="vista-horario" class="oculto">
      <div id="contenido-horario"></div>
    </div>

  </div>

  <!-- Fondo oscuro -->
  <div id="panel-overlay" class="oculto"></div>

  <!-- Panel formulario evento -->
  <div id="panel-formulario" class="oculto">
    <div id="panel-cabecera">
      <h3>Nuevo evento</h3>
      <button id="btn-cerrar-panel">✕</button>
    </div>
    <form id="form-evento">
      <label for="input-nombre">Nombre del evento</label>
      <input type="text" id="input-nombre" placeholder="Ej: Laboratorio de Física" required />

      <label for="input-fecha">Fecha</label>
      <input type="date" id="input-fecha" required />

      <label for="input-hora-inicio">Hora de inicio</label>
      <input type="time" id="input-hora-inicio" required />

      <label for="input-hora-fin">Hora de fin</label>
      <input type="time" id="input-hora-fin" />

      <label for="input-tipo">Tipo</label>
      <select id="input-tipo">
        <option value="clase">Clase</option>
        <option value="laboratorio">Laboratorio</option>
        <option value="examen">Examen</option>
        <option value="entrega">Entrega</option>
        <option value="reunion">Reunión</option>
        <option value="otro">Otro</option>
      </select>

      <button type="submit" id="btn-guardar">Guardar evento</button>
      <button type="button" id="btn-eliminar" class="oculto">🗑 Eliminar evento</button>
    </form>
  </div>

  <!-- Panel día -->
  <div id="panel-dia" class="oculto">
    <div id="panel-cabecera-dia">
      <h3 id="titulo-dia"></h3>
      <button id="btn-cerrar-dia">✕</button>
    </div>
    <div id="lista-eventos"></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
